[package]
name = "weathertrack-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
weathertrack-core = { path = "../crates/weathertrack-core" }

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "parse_forecast"
path = "fuzz_targets/parse_forecast.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_location"
path = "fuzz_targets/parse_location.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_json"
path = "fuzz_targets/cache_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wmo_alerts"
path = "fuzz_targets/wmo_alerts.rs"
test = false
doc = false
bench = false
