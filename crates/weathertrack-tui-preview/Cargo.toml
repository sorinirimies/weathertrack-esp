[package]
name = "weathertrack-tui-preview"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host renderer: the TUI through the real mousefood backend, every page to PNG"

[dependencies]
weathertrack-tui-ui = { path = "../weathertrack-tui-ui" }
weathertrack-view = { path = "../weathertrack-view" }
mousefood = { version = "0.5", default-features = false, features = ["fonts"] }
ratatui = { version = "0.30", default-features = false }
png = "0.17"

[lints.rust]
unsafe_code = "forbid"

# Not part of the main workspace.
[workspace]
