[package]
name = "weathertrack-hal"
version = "0.1.0"
edition = "2021"
authors = ["Sorin Irimies"]
license = "MIT"
description = "ESP32 hardware abstraction for weathertrack (LED, WiFi, NVS, SD, HTTP)"

[dependencies]
weathertrack-core = { path = "../weathertrack-core" }
log = "0.4"
esp-idf-svc = { version = "0.51", features = ["experimental"] }
esp-idf-hal = "0.45.2"
ws2812-esp32-rmt-driver = "0.13.0"
serde_json = "1"
anyhow = "1"
