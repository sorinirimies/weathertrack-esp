[package]
name = "weathertrack-hal"
version = "0.1.0"
edition = "2021"
authors = ["Sorin Irimies"]
license = "MIT"
description = "ESP32 hardware abstraction for weathertrack (LED, WiFi, NVS, SD, HTTP)"

[dependencies]
weathertrack-core = { path = "../weathertrack-core" }
weathertrack-view = { path = "../weathertrack-view" }
log = "0.4"
esp-idf-svc = { version = "0.51", features = ["experimental"] }
esp-idf-hal = "0.45.2"
ws2812-esp32-rmt-driver = "0.13.0"
serde_json = "1"
anyhow = "1"
# The blocking MQTT client (feature `mqtt`), from crates.io.
stem-mqtt-client-blocking = { version = "0.8.3", optional = true }

[features]
default = []
# Publish the weather to an MQTT broker and take commands (see `mqtt.rs`).
mqtt = ["dep:stem-mqtt-client-blocking"]

# cargo machete matches package names, and `use mqtt_client_blocking::...` is the library name of stem-mqtt-client-blocking.
[package.metadata.cargo-machete]
ignored = ["stem-mqtt-client-blocking"]
