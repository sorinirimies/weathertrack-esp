[package]
name = "weathertrack-p4-preview"
version = "0.1.0"
edition = "2021"
publish = false

# Host-side renderer: draws the P4 UI with Slint's software renderer into a PNG.
[dependencies]
slint = { version = "1.11", default-features = false, features = ["compat-1-2", "renderer-software", "std", "libm"] }
weathertrack-core = { path = "../weathertrack-core", default-features = false }
png = "0.17"

[build-dependencies]
slint-build = "1.11"

[workspace]
