[package]
name = "weathertrack-gui"
version = "0.1.0"
edition = "2021"
authors = ["Sorin Irimies"]
license = "MIT"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "weathertrack-gui"
harness = false

[profile.release]
opt-level = 3

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
weathertrack-core = { path = "../weathertrack-core", default-features = false }
weathertrack-view = { path = "../weathertrack-view" }
weathertrack-hal = { path = "../weathertrack-hal" }
log = "0.4"
esp-idf-svc = { version = "0.51", features = ["experimental"] }
esp-idf-hal = "0.45.2"
ws2812-esp32-rmt-driver = "0.13.0"
embedded-graphics = "0.8.1"
mipidsi = "0.9.0"

# Slint GUI framework
# "libm" is required for soft-float RISC-V targets (ESP32-C6 riscv32imac)
slint = { version = "1.11", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "unsafe-single-threaded",
    "libm",
] }

[build-dependencies]
embuild = "0.33"
slint-build = "1.11"
toml = "0.8"

[package.metadata.cargo-machete]
# Used by ../weathertrack-view/slint/bridge.rs, which is included by path (machete does not follow it).
ignored = ["weathertrack-view"]
