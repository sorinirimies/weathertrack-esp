[package]
name = "weathertrack-tui"
version = "0.1.0"
edition = "2021"
authors = ["Sorin Irimies"]
license = "MIT"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "weathertrack-tui"
harness = false

[profile.release]
opt-level = 3

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
weathertrack-core = { path = "../weathertrack-core", default-features = false }
log = "0.4"
esp-idf-svc = { version = "0.51", features = ["experimental"] }
esp-idf-hal = "0.45.2"
ws2812-esp32-rmt-driver = "0.13.0"
embedded-graphics = "0.8.1"
mipidsi = "0.9.0"
serde_json = "1"
anyhow = "1"

# Ratatui + mousefood for embedded TUI
ratatui = { version = "0.30", default-features = false }
mousefood = { git = "https://github.com/ratatui/mousefood", default-features = false, features = ["fonts"] }

[build-dependencies]
embuild = "0.33"
toml = "0.8"
