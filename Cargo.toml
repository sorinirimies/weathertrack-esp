[workspace]
resolver = "3"
# Only host-testable code is a workspace member. The firmware crates (tui, gui, hal,
# p4) need the ESP toolchain and their own .cargo/config.toml, so they build on their own.
members = ["crates/weathertrack-core", "crates/weathertrack-view", "crates/weathertrack-tui-ui"]
exclude = [
    "crates/weathertrack-tui",
    "crates/weathertrack-gui",
    "crates/weathertrack-hal",
    "crates/weathertrack-p4",
    "crates/weathertrack-s3",
    "crates/weathertrack-p4-preview",
    "crates/weathertrack-tui-preview",
    "crates/weathertrack-gui-preview",
    "crates/weathertrack-web",
]

# One version for every crate; `just bump X.Y.Z` edits it (and EXTRA_MANIFESTS).
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Sorin Albu-Irimies"]
repository = "https://github.com/sorinirimies/weathertrack-esp"
homepage = "https://github.com/sorinirimies/weathertrack-esp"

[workspace.dependencies]
weathertrack-core = { path = "crates/weathertrack-core", version = "0.1.0" }
weathertrack-view = { path = "crates/weathertrack-view", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
