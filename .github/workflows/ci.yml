name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p weathertrack-core --all-targets --all-features -- -D warnings -A deprecated

      - name: Test
        run: cargo test -p weathertrack-core --all-features --all-targets

      - name: Install nushell
        run: cargo install nu --locked

      - name: Nu tests
        run: nu scripts/tests/run_all.nu
